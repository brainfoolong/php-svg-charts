name: PHP SVG Charts Tests
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    
jobs:
  tests:
    strategy:
      matrix:
        phpversion: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "latest"]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install php
        uses: https://github.com/shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.phpversion }}
          extensions: mbstring, gd, dom
          tools: composer

      - name: Install composer libs
        run: cd dev && composer update

      - name: Run tests
        run: cd tests && php tests.php

      - name: Upload generated docs artifacts
        if: always()
        uses: actions/upload-artifact@v3.2.2
        with:
          name: ${{ matrix.php-versions }}_testresults
          path: ./tests/generated
          retention-days: 5
